apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: image1
  labels:
    app: app1
    tier: tier1

spec:
  replicas: 3

  selector:
    matchLabels:
      tier: tier1

  template:
    metadata:
      labels:
        app: app1
        tier: tier1

    spec:
      containers:
      - name: app-container-image
        image: souvik925saha/repo1:helloworld
        imagePullPolicy: Always
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service

metadata:
  name: javaimage-service
  labels:
    app: app1
    tier: tier1

spec:
  type: LoadBalancer

  selector:
    tier: tier1

  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080